<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portugal Internet Health</title>
  <style>
    :root { --bg:#fff; --fg:#1a1a1a; --muted:#555; --grid:#e5e5e5; --line:#f6821f; --fill:rgba(246,130,31,.15); --btn:#f2f2f2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14161a; --fg:#eee; --muted:#9aa0a6; --grid:#2b2f36; --btn:#23262d; }
    }
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: var(--fg); }
    h1 { margin-top: 0; margin-bottom: .25rem; }
    .sub, .meta { color: var(--muted); font-size: .9rem; }
    a { color: var(--line); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .gh { color: var(--muted); line-height: 0; padding: .25rem; }
    .gh:hover, .gh:focus-visible { color: var(--fg); }
    .ranges { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
    .ranges button { border: 0; padding: .45rem .9rem; border-radius: 999px; background: var(--btn); color: var(--fg); cursor: pointer; font: inherit; }
    .ranges button[aria-pressed="true"] { background: var(--line); color: #fff; }
    #status { min-height: 1.25rem; }
    .chart-box { position: relative; height: 360px; }
  </style>
</head>
<body>
  <header class="top">
    <h1>Portugal Internet Health</h1>
    <a class="gh" href="https://github.com/surtricecream/Portugal-Internet-Health"
       target="_blank" rel="noopener noreferrer"
       aria-label="View source on GitHub" title="View source on GitHub">
      <svg viewBox="0 0 16 16" width="28" height="28" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </header>
  <p class="sub">Relative HTTP traffic in Portugal, from Cloudflare Radar.</p>

  <div class="ranges" role="group" aria-label="Time range">
    <button data-range="1d">24 h</button>
    <button data-range="7d">7 days</button>
    <button data-range="30d">30 days</button>
    <button data-range="6m">6 months</button>
    <button data-range="1y">1 year</button>
  </div>

  <p id="status" class="meta" role="status"></p>
  <div class="chart-box"><canvas id="chart"></canvas></div>
  <p class="meta" id="meta"></p>
  <p class="meta">
    Values are a relative index within the selected window (0 = quietest point, 1 = busiest), not request counts,
    so levels are not comparable between ranges. Data: <a href="https://radar.cloudflare.com">Cloudflare Radar</a>.
  </p>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
